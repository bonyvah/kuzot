name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main runs this through deploy.yml
  workflow_call:              # deploy.yml runs it before building images

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kuzot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # Settings the app requires at import. Tests fake the external services,
      # so none of these is ever used to connect anywhere real.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/kuzot_test
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5433/kuzot_test
      MONGO_URI: mongodb://localhost:27017/kuzot
      REDIS_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      OPENAI_API_KEY: sk-ci-not-a-key
      PINECONE_API_KEY: ci-not-a-key
      PINECONE_INDEX_NAME: kuzot-ci
      JWT_SECRET_KEY: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-not-for-production
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check --ignore E501,I001 app tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build   # tsc + vite build
