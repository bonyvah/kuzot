name: Deploy

# Every push to main: test, build both images into GHCR, then roll the server
# forward. Also runnable by hand from the Actions tab.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         server address
#   VPS_USER         ssh user that can run docker (in the docker group)
#   VPS_SSH_KEY      private key for that user (the public key in ~/.ssh/authorized_keys)
#   VPS_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <VPS_HOST>
# Without VPS_HOST the images are still built and pushed; only the deploy is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # never interrupt a deploy halfway

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kuzot

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            context: .
            dockerfile: nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
        if: env.VPS_HOST != ''

      - name: Set up ssh
        if: env.VPS_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll the server forward
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh_() { ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$target" "$@"; }
          scp -i ~/.ssh/id_deploy -o BatchMode=yes docker-compose.prod.yml "$target:/opt/kuzot/docker-compose.yml"
          # the token is only good for this job: log in, pull, log out
          printf '%s' "$GHCR_TOKEN" | ssh_ "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh_ "cd /opt/kuzot && TAG=$SHA docker compose pull --quiet \
                && TAG=$SHA docker compose up -d --remove-orphans --wait --wait-timeout 300; \
                status=\$?; docker logout ghcr.io; docker image prune -f >/dev/null; exit \$status"

      - name: Smoke test
        if: env.VPS_HOST != ''
        run: |
          domain=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${{ secrets.VPS_USER }}@$VPS_HOST" \
                   "grep -E '^DOMAIN=' /opt/kuzot/.env | cut -d= -f2")
          for i in 1 2 3 4 5 6; do
            curl -fsSk "https://$domain/health/ready" && exit 0
            sleep 10
          done
          echo "https://$domain/health/ready did not answer"; exit 1
