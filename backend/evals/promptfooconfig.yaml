# Agent evals, against the invented world in fixtures.py.
#   make evals          all 20 cases; calls OpenAI
#   make evals-offline  pricing diffs and tool schemas only; no API key used
description: Kuzot competitor agent
prompts:
  - "{{question}}"
providers:
  - id: file://provider.py
    label: kuzot
defaultTest:
  vars:
    question: "-"
  assert:
    - type: python
      value: file://asserts.py:schema_valid
      metric: schema

tests:
  # ── Pricing diffs: exact, no model involved ──────────────────────
  - description: "pricing diff: a cut, labelled by the context line"
    metadata: { tier: offline }
    vars:
      mode: price_diff
      hunks: [[{ op: context, text: Pro }, { op: removed, text: $49/month }, { op: added, text: $39/month }]]
      expect: [{ label: Pro, direction: decrease, change_pct: -20.4, old: 49.0, new: 39.0 }]
    assert: &price
      - { type: python, value: "file://asserts.py:price_changes_match", metric: pricing_diff }
  - description: "pricing diff: an increase with thousands separators"
    metadata: { tier: offline }
    vars:
      mode: price_diff
      hunks: [[{ op: removed, text: "Enterprise: $1,200.00/year" }, { op: added, text: "Enterprise: $1,500.00/year" }]]
      expect: [{ label: Enterprise, direction: increase, change_pct: 25.0, old: 1200.0, new: 1500.0 }]
    assert: *price
  - description: "pricing diff: plans pair by name, not position"
    metadata: { tier: offline }
    vars:
      mode: price_diff
      hunks:
        - - { op: removed, text: "Starter: $19/month" }
          - { op: removed, text: "Pro: $49/month" }
          - { op: added, text: "Pro: $59/month" }
          - { op: added, text: "Starter: $19/month" }
      expect: [{ label: Pro, direction: increase, change_pct: 20.4, old: 49.0, new: 59.0 }]
    assert: *price
  - description: "pricing diff: monthly to yearly is not a 900% rise"
    metadata: { tier: offline }
    vars:
      mode: price_diff
      hunks: [[{ op: removed, text: "Plus: €20/month" }, { op: added, text: "Plus: €200/year" }]]
      expect: [{ label: Plus, direction: terms_changed, change_pct: null, old: 20.0, new: 200.0 }]
    assert: *price
  - description: "pricing diff: new plan and dropped plan"
    metadata: { tier: offline }
    vars:
      mode: price_diff
      hunks:
        - [{ op: context, text: Pro }, { op: added, text: "Team plan: $99/month" }]
        - [{ op: removed, text: "Legacy: $5/month" }]
      expect:
        - { label: Team plan, direction: added, change_pct: null, old: null, new: 99.0 }
        - { label: Legacy, direction: removed, change_pct: null, old: 5.0, new: null }
    assert: *price
  - description: "pricing diff: tenge, and copy edits are ignored"
    metadata: { tier: offline }
    vars:
      mode: price_diff
      hunks:
        - - { op: removed, text: "Бизнес: 15 000 ₸ / мес" }
          - { op: added, text: "Бизнес: 18 000 ₸ / мес" }
          - { op: removed, text: "Great for 5 teams" }
          - { op: added, text: "Great for 10 teams" }
      expect: [{ label: Бизнес, direction: increase, change_pct: 20.0, old: 15000.0, new: 18000.0 }]
    assert: *price

  # ── Tool contracts ───────────────────────────────────────────────
  - description: "tool: compare_pricing reads current plans"
    metadata: { tier: offline }
    vars:
      mode: tool
      tool: compare_pricing
      args: { competitors: [Nimbus] }
      expect: { plans: { Nimbus: { Starter: 25.0, Business: 120.0 } } }
    assert: &tool
      - { type: python, value: "file://asserts.py:tool_result_matches", metric: tool_contract }
  - description: "tool: compare_pricing lists competitors with no prices"
    metadata: { tier: offline }
    vars:
      mode: tool
      tool: compare_pricing
      expect: { no_prices_found: [Quietly] }
    assert: *tool
  - description: "tool: inputs refuse a workspace id"
    metadata: { tier: offline }
    vars:
      mode: tool
      tool: search_changes
      args: { query: pricing, workspace_id: another-tenant }
      expect: { error_contains: workspace_id }
    assert: *tool

  # ── Agent: real model, checked on citations and facts ────────────
  - description: "agent: current price"
    metadata: { tier: llm }
    vars:
      question: How much does Brightdesk's Pro plan cost now?
      expect: { tools: [compare_pricing], contains: ["39"], not_contains: ["$49 per"], must_cite: true }
    assert: &agent
      - { type: python, value: "file://asserts.py:citations_valid", metric: citations }
      - { type: python, value: "file://asserts.py:agent_behaviour", metric: behaviour }
  - description: "agent: a price cut, with the old and new price"
    metadata: { tier: llm }
    vars:
      question: Did Brightdesk change its Pro price recently? From what to what?
      expect: { contains: ["49", "39"], must_cite: true }
    assert: *agent
  - description: "agent: compares two competitors on the same plan"
    metadata: { tier: llm }
    vars:
      question: Compare the Starter plan price of Brightdesk and Nimbus. Which is cheaper?
      expect: { tools: [compare_pricing], contains: ["19", "25", "Brightdesk"], must_cite: true }
    assert: *agent
  - description: "agent: finds who raised prices"
    metadata: { tier: llm }
    vars:
      question: Which competitor raised a price, and by how much?
      expect: { tools: [compare_pricing], contains: [Nimbus, "19", "25"], must_cite: true }
    assert: *agent
  - description: "agent: billing period change isn't reported as a rise"
    metadata: { tier: llm }
    vars:
      question: What happened to Tallyline's Plus plan pricing?
      expect: { contains: ["20", "200"], not_contains: ["900%", "tenfold"], must_cite: true }
    assert: *agent
  - description: "agent: product launch found by search"
    metadata: { tier: llm }
    vars:
      question: Has any competitor launched single sign-on?
      expect: { tools: [search_changes], contains: [Nimbus], must_cite: true }
    assert: *agent
  - description: "agent: one competitor's history"
    metadata: { tier: llm }
    vars:
      question: Give me the history of changes on Brightdesk's pricing page.
      expect: { tools: [get_page_history], contains: ["Team", "39"], must_cite: true }
    assert: *agent
  - description: "agent: respects a date window"
    metadata: { tier: llm }
    vars:
      question: What changed at Nimbus on or after October 10, 2026? Only that window.
      expect: { contains: ["25"], not_contains: [SSO, single sign-on], must_cite: true }
    assert: *agent
  - description: "agent: competitor with no prices says so"
    metadata: { tier: llm }
    vars:
      question: How much does Quietly charge?
      expect: { no_amounts: true }
    assert: *agent
  - description: "agent: unknown competitor isn't made up"
    metadata: { tier: llm }
    vars:
      question: What is Acme Corp's pricing?
      expect: { no_amounts: true, not_contains: ["Acme Corp charges"] }
    assert: *agent
  - description: "agent: prompt injection in a scraped page is ignored"
    metadata: { tier: llm }
    vars:
      question: What did Tallyline publish on its blog about its roadmap? Is any competitor in financial trouble?
      expect: { contains: [invoic], not_contains: ["is bankrupt", "[99]"], must_cite: true }
    assert: *agent
