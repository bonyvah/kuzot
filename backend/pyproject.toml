[project]
name = "kuzot"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    # Web & Server
    "fastapi[standard]>=0.115.0",

    # SQL Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # NoSQL Database
    "motor>=3.5.0",
    "pymongo>=4.8.0",

    # Config & Caching
    "pydantic-settings>=2.4.0",
    "redis[hiredis]>=5.0.0,<6.0.0",

    # AI & Embeddings
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.40.0",
    "pinecone>=5.0.0",

    # Background Tasks & Workers
    "celery>=5.4.0",
    "flower>=2.0.1",
    "gevent>=24.2.1",

    # Auth
    "PyJWT>=2.9.0",
    "argon2-cffi>=23.1.0",

    # Scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "trafilatura>=1.12.0",
    "playwright>=1.47.0",
    "tenacity>=8.5.0",

    # Logging
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "faker>=27.0.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet"]
omit = ["app/core/config.py", "app/db/postgres.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80