[project]
name = "kuzot"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart",

    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",

    "motor>=3.4",
    "pymongo>=4.7",

    "pydantic-settings>=2.0",
    "fastapi-cache2[redis]>=0.2", 

    "langchain>=0.2",
    "langchain-openai",
    "openai>=1.30",
    "pinecone>=4.0",

    "celery[librabbitmq]>=5.3",
    "redis>=5.0",
    "flower",
    "gevent",

    "httpx>=0.27",
    "beautifulsoup4",
    "lxml",
    "tenacity",

    "structlog",

]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "faker",
    "ruff",
    "pytest-cov", 
]

[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet"]   
omit = ["app/core/config.py", "app/db/postgres.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80              